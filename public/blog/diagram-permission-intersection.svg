<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="The intersection problem: effective permissions are the overlap of user, agent, and session scope">
  <rect width="1000" height="480" fill="#fff8ef"/>
  <text x="40" y="40" font-family="Inter, sans-serif" font-weight="900" font-size="20" fill="#1d1815">The intersection problem: effective permissions = user ∩ agent ∩ session</text>
  <text x="40" y="64" font-family="Inter, sans-serif" font-size="13" fill="rgba(29,24,21,0.55)">An agent can never exceed the human who started it. Permissions only narrow, never widen.</text>

  <!-- Main Venn diagram area -->
  <g transform="translate(40,80)">
    <rect width="540" height="360" rx="16" fill="#fff" stroke="#1d1815" stroke-width="2"/>

    <!-- User permissions circle -->
    <circle cx="210" cy="155" r="115" fill="#eaf7ff" stroke="#1d1815" stroke-width="2" opacity="0.7"/>
    <text x="140" y="95" font-family="Inter, sans-serif" font-weight="800" font-size="14" fill="#1d1815">user permissions</text>
    <text x="115" y="115" font-family="ui-monospace, monospace" font-size="10" fill="rgba(29,24,21,0.5)">db.read, db.write,</text>
    <text x="115" y="130" font-family="ui-monospace, monospace" font-size="10" fill="rgba(29,24,21,0.5)">api.*, deploy, admin</text>

    <!-- Agent scope circle -->
    <circle cx="330" cy="155" r="115" fill="#fff6db" stroke="#1d1815" stroke-width="2" opacity="0.7"/>
    <text x="345" y="95" font-family="Inter, sans-serif" font-weight="800" font-size="14" fill="#1d1815">agent scope</text>
    <text x="355" y="115" font-family="ui-monospace, monospace" font-size="10" fill="rgba(29,24,21,0.5)">db.read, api.get,</text>
    <text x="355" y="130" font-family="ui-monospace, monospace" font-size="10" fill="rgba(29,24,21,0.5)">search, summarize</text>

    <!-- Session context circle -->
    <circle cx="270" cy="250" r="115" fill="#ffe9e4" stroke="#1d1815" stroke-width="2" opacity="0.7"/>
    <text x="195" y="330" font-family="Inter, sans-serif" font-weight="800" font-size="14" fill="#1d1815">session context</text>
    <text x="198" y="350" font-family="ui-monospace, monospace" font-size="10" fill="rgba(29,24,21,0.5)">tenant=acme, env=staging,</text>
    <text x="198" y="365" font-family="ui-monospace, monospace" font-size="10" fill="rgba(29,24,21,0.5)">sensitivity&lt;=internal</text>

    <!-- Center intersection highlight -->
    <circle cx="270" cy="185" r="38" fill="#1d1815" opacity="0.85"/>
    <!-- Lock icon in center -->
    <rect x="260" y="183" width="20" height="15" rx="3" fill="#fff"/>
    <path d="M264 183 L264 177 Q264 171 270 171 Q276 171 276 177 L276 183" stroke="#fff" stroke-width="2.5" fill="none"/>
    <circle cx="270" cy="190" r="2" fill="#1d1815"/>

    <!-- Effective label -->
    <text x="270" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="11" fill="#a3e4a3">effective</text>
  </g>

  <!-- Right side: explanation -->
  <g transform="translate(620,100)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-weight="900" font-size="14" fill="#1d1815" letter-spacing="1">HOW IT WORKS</text>

    <!-- Step 1 -->
    <g transform="translate(0,24)">
      <rect width="340" height="60" rx="11" fill="#eaf7ff" stroke="#1d1815" stroke-width="1.5"/>
      <text x="14" y="20" font-family="Inter, sans-serif" font-weight="800" font-size="12" fill="#1d1815">1. start with user permissions</text>
      <text x="14" y="38" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.6)">the human who initiated the agent</text>
      <text x="14" y="52" font-family="ui-monospace, monospace" font-size="10" fill="rgba(29,24,21,0.5)">perms = get_user_permissions(user_id)</text>
    </g>

    <!-- Arrow -->
    <path d="M 170 84 L 170 96" stroke="#1d1815" stroke-width="1.5" marker-end="url(#dpi_ar)"/>

    <!-- Step 2 -->
    <g transform="translate(0,100)">
      <rect width="340" height="60" rx="11" fill="#fff6db" stroke="#1d1815" stroke-width="1.5"/>
      <text x="14" y="20" font-family="Inter, sans-serif" font-weight="800" font-size="12" fill="#1d1815">2. intersect with agent scope</text>
      <text x="14" y="38" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.6)">agent only gets tools it was designed for</text>
      <text x="14" y="52" font-family="ui-monospace, monospace" font-size="10" fill="rgba(29,24,21,0.5)">perms = perms &amp; agent.allowed_tools</text>
    </g>

    <!-- Arrow -->
    <path d="M 170 160 L 170 172" stroke="#1d1815" stroke-width="1.5" marker-end="url(#dpi_ar)"/>

    <!-- Step 3 -->
    <g transform="translate(0,176)">
      <rect width="340" height="60" rx="11" fill="#ffe9e4" stroke="#1d1815" stroke-width="1.5"/>
      <text x="14" y="20" font-family="Inter, sans-serif" font-weight="800" font-size="12" fill="#1d1815">3. narrow by session context</text>
      <text x="14" y="38" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.6)">tenant, environment, sensitivity ceiling</text>
      <text x="14" y="52" font-family="ui-monospace, monospace" font-size="10" fill="rgba(29,24,21,0.5)">perms = perms &amp; session.constraints</text>
    </g>

    <!-- Arrow -->
    <path d="M 170 236 L 170 248" stroke="#1d1815" stroke-width="1.5" marker-end="url(#dpi_ar)"/>

    <!-- Result -->
    <g transform="translate(0,252)">
      <rect width="340" height="50" rx="11" fill="#1d1815"/>
      <text x="170" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="rgba(255,255,255,0.55)" letter-spacing="2">EFFECTIVE PERMISSIONS</text>
      <text x="170" y="40" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#a3e4a3">only what survives all three filters</text>
    </g>

    <!-- Key rule -->
    <g transform="translate(0,320)">
      <rect width="340" height="48" rx="10" fill="#fff" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="170" y="20" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="12" fill="#ff6b6b">Rule: permissions only narrow.</text>
      <text x="170" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.6)">No step in the chain can add permissions back.</text>
    </g>
  </g>

  <!-- Bottom caption -->
  <text x="40" y="462" font-family="Inter, sans-serif" font-size="12" fill="rgba(29,24,21,0.5)">The effective permission set is always the intersection of all three scopes. An agent acting on behalf of user A, in tenant B's session, can only do what all three allow simultaneously.</text>

  <defs>
    <marker id="dpi_ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1d1815"/></marker>
  </defs>
</svg>