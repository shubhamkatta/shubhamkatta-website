<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Compliance mapping: from technical controls to regulatory frameworks">
  <rect width="1200" height="600" fill="#eaf7ff"/>
  <!-- Decorative tape strip -->
  <rect x="480" y="28" width="180" height="18" rx="4" fill="#fff6db" opacity="0.9" transform="rotate(-1.2 570 37)"/>

  <!-- Left side: Technical controls card -->
  <g transform="translate(60,80) rotate(-1.8)">
    <rect width="420" height="440" rx="22" fill="#fff" stroke="#1d1815" stroke-width="2"/>
    <text x="22" y="34" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="rgba(29,24,21,0.55)" letter-spacing="2">YOUR CONTROLS</text>
    <line x1="22" y1="48" x2="398" y2="48" stroke="rgba(29,24,21,0.15)"/>

    <!-- Audit trail -->
    <g transform="translate(22,64)">
      <rect width="376" height="56" rx="11" fill="#fff6db" stroke="#1d1815" stroke-width="1.5"/>
      <text x="14" y="22" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="#1d1815">audit trail</text>
      <text x="14" y="42" font-family="ui-monospace, monospace" font-size="11" fill="rgba(29,24,21,0.6)">structured events, immutable, queryable</text>
    </g>

    <!-- Policy engine -->
    <g transform="translate(22,134)">
      <rect width="376" height="56" rx="11" fill="#ffe9e4" stroke="#1d1815" stroke-width="1.5"/>
      <text x="14" y="22" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="#1d1815">policy engine</text>
      <text x="14" y="42" font-family="ui-monospace, monospace" font-size="11" fill="rgba(29,24,21,0.6)">versioned rules, allow/deny, human gates</text>
    </g>

    <!-- Observability -->
    <g transform="translate(22,204)">
      <rect width="376" height="56" rx="11" fill="#a3e4a3" stroke="#1d1815" stroke-width="1.5"/>
      <text x="14" y="22" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="#1d1815">observability</text>
      <text x="14" y="42" font-family="ui-monospace, monospace" font-size="11" fill="rgba(29,24,21,0.6)">latency, cost, tokens, alerts</text>
    </g>

    <!-- Eval pipeline -->
    <g transform="translate(22,274)">
      <rect width="376" height="56" rx="11" fill="#eaf7ff" stroke="#1d1815" stroke-width="1.5"/>
      <text x="14" y="22" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="#1d1815">eval pipeline</text>
      <text x="14" y="42" font-family="ui-monospace, monospace" font-size="11" fill="rgba(29,24,21,0.6)">faithfulness, relevancy, context recall</text>
    </g>

    <text x="22" y="370" font-family="Inter, sans-serif" font-size="12" fill="rgba(29,24,21,0.45)">engineering artifacts</text>

    <!-- Checkmarks -->
    <g font-family="Inter, sans-serif" font-size="18" fill="#a3e4a3">
      <text x="370" y="100">&#10003;</text>
      <text x="370" y="170">&#10003;</text>
      <text x="370" y="240">&#10003;</text>
      <text x="370" y="310">&#10003;</text>
    </g>
  </g>

  <!-- Arrows in the middle -->
  <defs>
    <marker id="cmar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ff6b6b"/></marker>
  </defs>
  <g stroke="#ff6b6b" stroke-width="2.5" fill="none">
    <path d="M 480 180 L 540 180" marker-end="url(#cmar)"/>
    <path d="M 480 260 L 540 300" marker-end="url(#cmar)"/>
    <path d="M 480 340 L 540 400" marker-end="url(#cmar)"/>
  </g>
  <text x="495" y="290" font-family="Inter, sans-serif" font-weight="900" font-size="11" fill="#ff6b6b" letter-spacing="1" transform="rotate(-90 495 290)">MAPS TO</text>

  <!-- Right side: title and framework pills -->
  <g transform="translate(570,70)">
    <text x="0" y="50" font-family="Inter, sans-serif" font-weight="900" font-size="46" fill="#1d1815" letter-spacing="-2">Compliance</text>
    <text x="0" y="104" font-family="Inter, sans-serif" font-weight="900" font-size="46" fill="#1d1815" letter-spacing="-2">mapping.</text>
    <text x="0" y="148" font-family="Inter, sans-serif" font-weight="700" font-size="20" fill="#ff6b6b">controls to frameworks.</text>

    <!-- Framework pills -->
    <g transform="translate(0,190)">
      <rect width="220" height="48" rx="14" fill="#1d1815"/>
      <text x="16" y="22" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="#eaf7ff">EU AI Act</text>
      <text x="16" y="40" font-family="ui-monospace, monospace" font-size="10" fill="rgba(234,247,255,0.6)">Art. 9, 12, 13, 14, 72</text>
    </g>
    <g transform="translate(240,190)">
      <rect width="220" height="48" rx="14" fill="#1d1815"/>
      <text x="16" y="22" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="#eaf7ff">NIST AI RMF</text>
      <text x="16" y="40" font-family="ui-monospace, monospace" font-size="10" fill="rgba(234,247,255,0.6)">Govern, Map, Measure, Manage</text>
    </g>
    <g transform="translate(0,252)">
      <rect width="220" height="48" rx="14" fill="#1d1815"/>
      <text x="16" y="22" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="#eaf7ff">ISO 42001</text>
      <text x="16" y="40" font-family="ui-monospace, monospace" font-size="10" fill="rgba(234,247,255,0.6)">Clauses 6.1, 9.1, 10.1</text>
    </g>
    <g transform="translate(240,252)">
      <rect width="220" height="48" rx="14" fill="none" stroke="#1d1815" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="16" y="22" font-family="Inter, sans-serif" font-weight="800" font-size="13" fill="rgba(29,24,21,0.5)">your next framework</text>
      <text x="16" y="40" font-family="ui-monospace, monospace" font-size="10" fill="rgba(29,24,21,0.35)">same controls, new mapping</text>
    </g>

    <text x="0" y="346" font-family="Inter, sans-serif" font-size="14" fill="rgba(29,24,21,0.6)">same systems, different language.</text>
    <text x="0" y="368" font-family="Inter, sans-serif" font-size="14" fill="rgba(29,24,21,0.6)">the mapping is the bridge.</text>
  </g>
</svg>
