<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Red-teaming your own AI — a structured adversarial playbook">
  <rect width="1200" height="600" fill="#ffe9e4"/>
  <!-- Decorative tape strip -->
  <rect x="520" y="24" width="200" height="20" rx="4" fill="#fff6db" opacity="0.9" transform="rotate(-1.5 620 34)"/>
  <!-- Left card: target / attack tree -->
  <g transform="translate(70,90) rotate(-1.8)">
    <rect width="500" height="410" rx="22" fill="#fff" stroke="#1d1815" stroke-width="2"/>
    <text x="24" y="38" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="rgba(29,24,21,0.5)" letter-spacing="2">RED-TEAM RUN · v3.1</text>
    <line x1="24" y1="54" x2="476" y2="54" stroke="rgba(29,24,21,0.15)"/>
    <!-- Target circle -->
    <g transform="translate(250,170)">
      <circle r="90" fill="none" stroke="#ff6b6b" stroke-width="2.5" opacity="0.25"/>
      <circle r="60" fill="none" stroke="#ff6b6b" stroke-width="2.5" opacity="0.45"/>
      <circle r="30" fill="none" stroke="#ff6b6b" stroke-width="2.5" opacity="0.7"/>
      <circle r="8" fill="#ff6b6b"/>
    </g>
    <!-- Attack vector arrows pointing at target -->
    <g stroke="#1d1815" stroke-width="2" marker-end="url(#rtcov_ar)">
      <line x1="60" y1="100" x2="170" y2="155" opacity="0.7"/>
      <line x1="440" y1="110" x2="330" y2="155" opacity="0.7"/>
      <line x1="80" y1="270" x2="170" y2="200" opacity="0.7"/>
      <line x1="420" y1="280" x2="330" y2="200" opacity="0.7"/>
      <line x1="250" y1="300" x2="250" y2="260" opacity="0.7"/>
    </g>
    <!-- Attack labels -->
    <g font-family="ui-monospace, monospace" font-size="10" fill="#1d1815">
      <g transform="translate(20,92)">
        <rect width="110" height="22" rx="6" fill="#ffe9e4" stroke="#1d1815" stroke-width="1.5"/>
        <text x="8" y="15">prompt inject</text>
      </g>
      <g transform="translate(370,100)">
        <rect width="110" height="22" rx="6" fill="#eaf7ff" stroke="#1d1815" stroke-width="1.5"/>
        <text x="8" y="15">tool abuse</text>
      </g>
      <g transform="translate(24,268)">
        <rect width="120" height="22" rx="6" fill="#fff6db" stroke="#1d1815" stroke-width="1.5"/>
        <text x="8" y="15">data exfiltrate</text>
      </g>
      <g transform="translate(362,278)">
        <rect width="106" height="22" rx="6" fill="#a3e4a3" stroke="#1d1815" stroke-width="1.5"/>
        <text x="8" y="15">priv escalate</text>
      </g>
      <g transform="translate(196,302)">
        <rect width="110" height="22" rx="6" fill="#ffe9e4" stroke="#1d1815" stroke-width="1.5"/>
        <text x="8" y="15">jailbreak</text>
      </g>
    </g>
    <!-- Results row -->
    <line x1="24" y1="340" x2="476" y2="340" stroke="rgba(29,24,21,0.15)"/>
    <g font-family="ui-monospace, monospace" font-size="12" fill="#1d1815">
      <text x="24" y="368">probes run</text>
      <text x="160" y="368" font-weight="800" fill="#1d1815">247</text>
      <text x="220" y="368">bypasses</text>
      <text x="330" y="368" font-weight="800" fill="#ff6b6b">14</text>
      <text x="370" y="368">pass rate</text>
      <text x="460" y="368" font-weight="800" fill="#a3e4a3">94.3%</text>
    </g>
    <text x="24" y="396" font-family="Inter, sans-serif" font-size="12" fill="rgba(29,24,21,0.5)">last run: 2026-07-04 · CI pipeline #891</text>
  </g>
  <!-- Right side title text -->
  <g transform="translate(620,160)">
    <text x="0" y="50" font-family="Inter, sans-serif" font-weight="900" font-size="48" fill="#1d1815" letter-spacing="-2">Red-teaming</text>
    <text x="0" y="110" font-family="Inter, sans-serif" font-weight="900" font-size="48" fill="#1d1815" letter-spacing="-2">your own AI.</text>
    <text x="0" y="168" font-family="Inter, sans-serif" font-weight="700" font-size="21" fill="#ff6b6b">attack it before</text>
    <text x="0" y="196" font-family="Inter, sans-serif" font-weight="700" font-size="21" fill="#ff6b6b">someone else does.</text>
    <text x="0" y="250" font-family="Inter, sans-serif" font-weight="500" font-size="14" fill="rgba(29,24,21,0.6)">prompt injection, tool abuse, data</text>
    <text x="0" y="270" font-family="Inter, sans-serif" font-weight="500" font-size="14" fill="rgba(29,24,21,0.6)">exfiltration — a structured playbook.</text>
  </g>
  <defs>
    <marker id="rtcov_ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1d1815"/></marker>
  </defs>
</svg>