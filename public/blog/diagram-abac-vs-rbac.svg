<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="RBAC vs ABAC for AI agents: static roles versus dynamic attribute evaluation">
  <rect width="1000" height="480" fill="#fff8ef"/>
  <text x="40" y="40" font-family="Inter, sans-serif" font-weight="900" font-size="20" fill="#1d1815">RBAC vs ABAC: why static roles break for agents</text>
  <text x="40" y="64" font-family="Inter, sans-serif" font-size="13" fill="rgba(29,24,21,0.55)">RBAC assigns permissions at deploy time. ABAC evaluates attributes at runtime — who, what, where, and how sensitive.</text>

  <!-- RBAC side (left) -->
  <g transform="translate(40,90)">
    <rect width="420" height="340" rx="16" fill="#fff" stroke="#1d1815" stroke-width="2"/>
    <text x="210" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="14" fill="rgba(29,24,21,0.5)" letter-spacing="2">RBAC</text>
    <text x="210" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.45)">role-based access control</text>

    <!-- User/Agent -->
    <g transform="translate(30,72)">
      <rect width="120" height="40" rx="10" fill="#eaf7ff" stroke="#1d1815" stroke-width="2"/>
      <text x="60" y="26" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="12" fill="#1d1815">agent</text>
    </g>
    <!-- Arrow to role -->
    <path d="M 150 92 L 178 92" stroke="#1d1815" stroke-width="2" marker-end="url(#dav_ar)"/>
    <!-- Role box -->
    <g transform="translate(188,72)">
      <rect width="100" height="40" rx="10" fill="#fff6db" stroke="#1d1815" stroke-width="2"/>
      <text x="50" y="26" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#1d1815">role:analyst</text>
    </g>
    <!-- Arrow to permissions -->
    <path d="M 288 92 L 316 92" stroke="#1d1815" stroke-width="2" marker-end="url(#dav_ar)"/>
    <!-- Permission list -->
    <g transform="translate(326,66)">
      <rect width="70" height="16" rx="4" fill="#a3e4a3" stroke="#1d1815" stroke-width="1"/>
      <text x="35" y="12" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1d1815">db.read</text>
    </g>
    <g transform="translate(326,86)">
      <rect width="70" height="16" rx="4" fill="#a3e4a3" stroke="#1d1815" stroke-width="1"/>
      <text x="35" y="12" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1d1815">api.call</text>
    </g>
    <g transform="translate(326,106)">
      <rect width="70" height="16" rx="4" fill="#a3e4a3" stroke="#1d1815" stroke-width="1"/>
      <text x="35" y="12" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1d1815">file.read</text>
    </g>

    <!-- Problem illustration -->
    <g transform="translate(30,140)">
      <rect width="360" height="2" fill="rgba(29,24,21,0.1)"/>
    </g>
    <text x="30" y="168" font-family="Inter, sans-serif" font-weight="800" font-size="12" fill="#ff6b6b">Problem: static at deploy time</text>

    <!-- Chain scenario -->
    <g transform="translate(30,186)">
      <rect width="80" height="30" rx="6" fill="#eaf7ff" stroke="#1d1815" stroke-width="1.5"/>
      <text x="40" y="20" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1d1815">db.read</text>
    </g>
    <path d="M 110 201 L 128 201" stroke="#1d1815" stroke-width="1.5" marker-end="url(#dav_ar)"/>
    <g transform="translate(138,186)">
      <rect width="80" height="30" rx="6" fill="#fff6db" stroke="#1d1815" stroke-width="1.5"/>
      <text x="40" y="20" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#1d1815">api.call</text>
    </g>
    <path d="M 218 201 L 236 201" stroke="#1d1815" stroke-width="1.5" marker-end="url(#dav_ar)"/>
    <g transform="translate(246,186)">
      <rect width="140" height="30" rx="6" fill="#ffe9e4" stroke="#ff6b6b" stroke-width="2"/>
      <text x="70" y="20" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#ff6b6b">db.write (oops)</text>
    </g>

    <text x="30" y="242" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.6)">Tool chain produces a composite action</text>
    <text x="30" y="258" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.6)">that exceeds any single role's intent.</text>
    <text x="30" y="278" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.6)">Role was granted once. Context changed.</text>
    <text x="30" y="298" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.6)">RBAC has no mechanism to notice.</text>

    <!-- Red X -->
    <g transform="translate(340,270)">
      <circle r="20" fill="#ff6b6b" opacity="0.15"/>
      <text x="0" y="7" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="22" fill="#ff6b6b">X</text>
    </g>
  </g>

  <!-- ABAC side (right) -->
  <g transform="translate(520,90)">
    <rect width="440" height="340" rx="16" fill="#fff" stroke="#1d1815" stroke-width="2"/>
    <text x="220" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="14" fill="rgba(29,24,21,0.5)" letter-spacing="2">ABAC</text>
    <text x="220" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.45)">attribute-based access control</text>

    <!-- Four attribute boxes -->
    <g transform="translate(20,72)">
      <rect width="190" height="42" rx="8" fill="#eaf7ff" stroke="#1d1815" stroke-width="1.5"/>
      <text x="14" y="18" font-family="Inter, sans-serif" font-weight="800" font-size="11" fill="#1d1815">subject attributes</text>
      <text x="14" y="34" font-family="ui-monospace, monospace" font-size="10" fill="rgba(29,24,21,0.6)">agent_id, user_id, clearance</text>
    </g>
    <g transform="translate(226,72)">
      <rect width="190" height="42" rx="8" fill="#fff6db" stroke="#1d1815" stroke-width="1.5"/>
      <text x="14" y="18" font-family="Inter, sans-serif" font-weight="800" font-size="11" fill="#1d1815">resource attributes</text>
      <text x="14" y="34" font-family="ui-monospace, monospace" font-size="10" fill="rgba(29,24,21,0.6)">sensitivity, tenant, owner</text>
    </g>
    <g transform="translate(20,122)">
      <rect width="190" height="42" rx="8" fill="#ffe9e4" stroke="#1d1815" stroke-width="1.5"/>
      <text x="14" y="18" font-family="Inter, sans-serif" font-weight="800" font-size="11" fill="#1d1815">action attributes</text>
      <text x="14" y="34" font-family="ui-monospace, monospace" font-size="10" fill="rgba(29,24,21,0.6)">tool, operation, risk_level</text>
    </g>
    <g transform="translate(226,122)">
      <rect width="190" height="42" rx="8" fill="#a3e4a3" stroke="#1d1815" stroke-width="1.5"/>
      <text x="14" y="18" font-family="Inter, sans-serif" font-weight="800" font-size="11" fill="#1d1815">context attributes</text>
      <text x="14" y="34" font-family="ui-monospace, monospace" font-size="10" fill="rgba(29,24,21,0.6)">session_depth, chain_len, time</text>
    </g>

    <!-- Arrows down to engine -->
    <path d="M 115 164 L 115 180" stroke="#1d1815" stroke-width="1.5" marker-end="url(#dav_ar)"/>
    <path d="M 321 164 L 321 180" stroke="#1d1815" stroke-width="1.5" marker-end="url(#dav_ar)"/>

    <!-- Policy engine -->
    <g transform="translate(20,188)">
      <rect width="396" height="40" rx="10" fill="#1d1815"/>
      <text x="198" y="16" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="11" fill="rgba(255,255,255,0.55)" letter-spacing="2">POLICY ENGINE</text>
      <text x="198" y="32" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#f6efe6">evaluate(subject, resource, action, context)</text>
    </g>

    <!-- Arrow down -->
    <path d="M 218 228 L 218 244" stroke="#1d1815" stroke-width="1.5" marker-end="url(#dav_ar)"/>

    <!-- Allow/Deny -->
    <g transform="translate(70,248)">
      <rect width="110" height="34" rx="8" fill="#a3e4a3" stroke="#1d1815" stroke-width="1.5"/>
      <text x="55" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="13" fill="#1d1815">ALLOW</text>
    </g>
    <g transform="translate(200,248)">
      <rect width="110" height="34" rx="8" fill="#ff6b6b" stroke="#1d1815" stroke-width="1.5"/>
      <text x="55" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="13" fill="#fff">DENY</text>
    </g>

    <!-- Key advantage note -->
    <text x="20" y="308" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#1d1815">Evaluated at runtime, every call.</text>
    <text x="20" y="326" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.6)">Permissions narrow as context changes.</text>

    <!-- Green check -->
    <g transform="translate(380,300)">
      <circle r="18" fill="#a3e4a3" opacity="0.3"/>
      <text x="0" y="7" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="20" fill="#1d1815">&#x2713;</text>
    </g>
  </g>

  <!-- Bottom caption -->
  <text x="40" y="456" font-family="Inter, sans-serif" font-size="12" fill="rgba(29,24,21,0.5)">RBAC: permissions fixed at role assignment. ABAC: permissions computed from live attributes on every action. For agents that chain tools and shift contexts, only the second approach holds.</text>

  <defs>
    <marker id="dav_ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1d1815"/></marker>
  </defs>
</svg>