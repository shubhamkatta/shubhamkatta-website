<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Human-in-the-loop done right: approval workflows that don't bottleneck">
  <rect width="1200" height="600" fill="#fff6db"/>
  <!-- Subtle grid texture -->
  <g opacity="0.04">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#1d1815" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#1d1815" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#1d1815" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#1d1815" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#1d1815" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#1d1815" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#1d1815" stroke-width="1"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="#1d1815" stroke-width="1"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#1d1815" stroke-width="1"/>
  </g>
  <!-- Tape strip top-left -->
  <rect x="60" y="20" width="180" height="18" rx="3" fill="#fff" opacity="0.7" transform="rotate(-2 150 29)"/>
  <!-- Left panel: approval queue card -->
  <g transform="translate(70, 80) rotate(-1.5)">
    <rect width="500" height="440" rx="22" fill="#fff" stroke="#1d1815" stroke-width="2"/>
    <text x="24" y="36" font-family="Inter, sans-serif" font-weight="900" font-size="12" fill="rgba(29,24,21,0.5)" letter-spacing="2">APPROVAL QUEUE</text>
    <!-- Agent request 1 — approved -->
    <g transform="translate(24, 56)">
      <rect width="452" height="56" rx="12" fill="#a3e4a3" stroke="#1d1815" stroke-width="1.5"/>
      <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#1d1815">deploy v2.4.1 → production</text>
      <text x="16" y="42" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.6)">risk: high  ·  async approval  ·  approved 4m ago</text>
      <text x="422" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="16" fill="#1d1815">&#10003;</text>
    </g>
    <!-- Agent request 2 — waiting -->
    <g transform="translate(24, 122)">
      <rect width="452" height="56" rx="12" fill="#eaf7ff" stroke="#1d1815" stroke-width="1.5"/>
      <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#1d1815">delete user_data where tenant=acme</text>
      <text x="16" y="42" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.6)">risk: critical  ·  sync approval  ·  waiting...</text>
      <circle cx="430" cy="28" r="8" fill="#fff6db" stroke="#1d1815" stroke-width="1.5"/>
      <text x="430" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="11" fill="#1d1815">?</text>
    </g>
    <!-- Agent request 3 — auto-approved -->
    <g transform="translate(24, 188)">
      <rect width="452" height="56" rx="12" fill="#fff6db" stroke="#1d1815" stroke-width="1.5"/>
      <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#1d1815">send_slack_notification(#alerts)</text>
      <text x="16" y="42" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.6)">risk: low  ·  auto-approved  ·  post-hoc review</text>
      <text x="422" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="12" fill="rgba(29,24,21,0.5)">auto</text>
    </g>
    <!-- Agent request 4 — denied -->
    <g transform="translate(24, 254)">
      <rect width="452" height="56" rx="12" fill="#ffe9e4" stroke="#1d1815" stroke-width="1.5"/>
      <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#1d1815">export all_customer_emails</text>
      <text x="16" y="42" font-family="Inter, sans-serif" font-size="11" fill="rgba(29,24,21,0.6)">risk: critical  ·  sync approval  ·  denied</text>
      <text x="422" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-weight="900" font-size="16" fill="#ff6b6b">&#10007;</text>
    </g>
    <!-- Escalation timeout indicator -->
    <g transform="translate(24, 330)">
      <rect width="452" height="56" rx="12" fill="#1d1815"/>
      <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#f6efe6">reindex search (15k docs)</text>
      <text x="16" y="42" font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">risk: medium  ·  timeout 30m  ·  escalated to #ops</text>
      <text x="410" y="34" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#ff6b6b">29:41</text>
    </g>
    <!-- Stats bar -->
    <g transform="translate(24, 400)">
      <text x="0" y="16" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="rgba(29,24,21,0.45)">today: 42 approved  ·  3 denied  ·  2 escalated  ·  0 timed out</text>
    </g>
  </g>

  <!-- Right side: title and tagline -->
  <g transform="translate(630, 150)">
    <text x="0" y="50" font-family="Inter, sans-serif" font-weight="900" font-size="48" fill="#1d1815" letter-spacing="-2">Human in</text>
    <text x="0" y="106" font-family="Inter, sans-serif" font-weight="900" font-size="48" fill="#1d1815" letter-spacing="-2">the loop,</text>
    <text x="0" y="162" font-family="Inter, sans-serif" font-weight="900" font-size="48" fill="#ff6b6b" letter-spacing="-2">done right.</text>
    <text x="0" y="218" font-family="Inter, sans-serif" font-weight="600" font-size="18" fill="rgba(29,24,21,0.6)">approval workflows that</text>
    <text x="0" y="244" font-family="Inter, sans-serif" font-weight="600" font-size="18" fill="rgba(29,24,21,0.6)">don't bottleneck.</text>
    <!-- Small human + agent icons -->
    <g transform="translate(10, 280)">
      <rect width="80" height="34" rx="8" fill="#1d1815"/>
      <text x="40" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="11" fill="#fff">agent</text>
    </g>
    <path d="M 90 297 L 120 297" stroke="#1d1815" stroke-width="2" marker-end="url(#chitl_ar)"/>
    <g transform="translate(130, 280)">
      <rect width="80" height="34" rx="8" fill="#eaf7ff" stroke="#1d1815" stroke-width="1.5"/>
      <text x="40" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="11" fill="#1d1815">policy</text>
    </g>
    <path d="M 210 297 L 240 297" stroke="#1d1815" stroke-width="2" marker-end="url(#chitl_ar)"/>
    <g transform="translate(250, 280)">
      <rect width="80" height="34" rx="8" fill="#a3e4a3" stroke="#1d1815" stroke-width="1.5"/>
      <text x="40" y="22" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="11" fill="#1d1815">human</text>
    </g>
  </g>
  <!-- Tape strip bottom-right -->
  <rect x="940" y="560" width="160" height="16" rx="3" fill="#fff" opacity="0.6" transform="rotate(1.5 1020 568)"/>
  <defs>
    <marker id="chitl_ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1d1815"/></marker>
  </defs>
</svg>